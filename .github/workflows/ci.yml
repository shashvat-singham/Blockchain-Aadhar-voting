name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint Solidity
        run: npm run lint:sol

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # The serverless functions ship a hand-written ABI so they do not depend
      # on a compile step at deploy time. Catch drift here rather than at 2am
      # during an election.
      - name: Check API ABI matches the compiled contract
        run: |
          node -e "
            const { ethers } = require('ethers');
            const artifact = require('./artifacts/contracts/AadhaarVoting.sol/AadhaarVoting.json');
            const { AADHAAR_VOTING_ABI } = require('./api/_lib/abi');
            const SIGNABLE = new Set(['function', 'event', 'error']);
            const sigs = abi => new ethers.Interface(abi).fragments
              .filter(f => SIGNABLE.has(f.type))
              .map(f => f.format('sighash'));
            const compiled = new Set(sigs(artifact.abi));
            const drift = sigs(AADHAAR_VOTING_ABI).filter(sig => !compiled.has(sig));
            if (drift.length) {
              console.error('api/_lib/abi.js is out of sync:\n  ' + drift.join('\n  '));
              process.exit(1);
            }
            console.log('ABI in sync.');
          "

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the deployable target only. The toolchain target downloads a
      # Solidity compiler and is already exercised by the contracts job.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: aadhaar-voting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # With no chain configured the app must still start and report *why* it
      # cannot accept votes, rather than crashing on boot.
      - name: Container starts and reports its own readiness
        run: |
          docker run -d --name voting -p 3000:3000 \
            -e SESSION_SECRET=ci-session-secret-that-is-long-enough-000 \
            -e NULLIFIER_SECRET=ci-nullifier-secret-that-is-long-enough-0 \
            -e AADHAAR_PEPPER=ci-aadhaar-pepper-that-is-long-enough-000 \
            aadhaar-voting:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then break; fi
            [ "$i" -eq 30 ] && { docker logs voting; exit 1; }
            sleep 1
          done

          curl -fsS http://localhost:3000/ | grep -q 'Aadhaar Voting'
          echo "Static frontend served."

          status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          cat /tmp/health.json
          [ "$status" = "503" ] || { echo "Expected 503 without a chain, got $status"; exit 1; }
          echo "Health endpoint correctly reports degraded."

          # The image must not carry an electoral roll or any secrets.
          docker run --rm --entrypoint sh aadhaar-voting:ci -c \
            '! test -f /app/data/voters.json && ! test -f /app/.env && echo "No PII or secrets baked into the image."'

          docker rm -f voting

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Every function must at least load: a syntax error or bad require in a
      # serverless handler otherwise only surfaces on the first live request.
      - name: Load every serverless function
        env:
          SESSION_SECRET: ci-session-secret-that-is-long-enough-000
          NULLIFIER_SECRET: ci-nullifier-secret-that-is-long-enough-0
          AADHAAR_PEPPER: ci-aadhaar-pepper-that-is-long-enough-000
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return walk(full);
              return entry.isFile() && entry.name.endsWith('.js') ? [full] : [];
            });
            let count = 0;
            for (const file of walk('api')) {
              const loaded = require(path.resolve(file));
              if (!path.basename(path.dirname(file)).startsWith('_') && typeof loaded !== 'function') {
                console.error(file + ' does not export a handler function');
                process.exit(1);
              }
              count++;
            }
            console.log('Loaded ' + count + ' modules.');
          "
